<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardioTwin AI — Cardiovascular Digital Twin & Predictive Health Intelligence</title>
    <meta name="description" content="Personalized cardiovascular digital twin and predictive health intelligence platform. Combines EHR history with real-time simulated wearable streams for physiological risk prediction, what-if digital twin simulations, and clinical explainability." />
    <meta property="og:title" content="CardioTwin AI — Cardiovascular Digital Twin & Predictive Health Intelligence" />
    <meta property="og:description" content="Personalized cardiovascular digital twin and predictive health intelligence platform. Combines EHR history with real-time simulated wearable streams for physiological risk prediction, what-if digital twin simulations, and clinical explainability." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cardiotwin_theme_preference') || 'dark';
          var resolved = saved;
          if (saved === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.remove('dark', 'light', 'high-contrast');
          if (resolved === 'high-contrast') {
            root.classList.add('dark', 'high-contrast');
            root.setAttribute('data-theme', 'high-contrast');
          } else {
            root.classList.add(resolved);
            root.setAttribute('data-theme', resolved);
          }
          var savedLang = localStorage.getItem('cardiotwin_language_preference');
          if (savedLang) {
            root.setAttribute('lang', savedLang);
            root.setAttribute('data-language', savedLang);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
